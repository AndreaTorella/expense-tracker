<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi | Expense Tracker</title>
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card" aria-labelledby="login-title">
            <div class="login-brand">
                <span class="app-eyebrow">Expense Tracker</span>
                <h1 id="login-title">Bentornato</h1>
                <p>Accedi per gestire i tuoi movimenti e consultare il riepilogo finanziario.</p>
            </div>

            <form id="login-form">
                <div id="login-error-message" class="alert alert-danger" role="alert" hidden></div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input id="email" name="email" type="email" class="form-control" autocomplete="email" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Password</label>
                    <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                </div>
                <button id="login-button" type="submit" class="btn btn-primary w-100 login-button">
                    <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
                    Accedi
                </button>
            </form>
        </section>
    </main>
    <script type="module" src="/js/login-page.js"></script>
</body>
</html>
